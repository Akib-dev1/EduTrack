<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Results</title>
  <link rel="stylesheet" href="assets/css/student.css">
  <script src="assets/js/student-data.js" defer></script>
  <script src="assets/js/student.js" defer></script>
</head>
<body data-page="results">
  <div class="layout">
    <aside class="sidebar">
      <p class="brand">EduTrack</p>
      <nav aria-label="Student pages">
        <a href="dashboard.html">Dashboard</a>
        <a href="courses.html">My courses</a>
        <a href="attendance.html">My attendance</a>
        <a class="active" href="results.html" aria-current="page">My results</a>
      </nav>
    </aside>
    <div class="content">
      <header class="topbar">
        <p>Student: <strong data-student-name>Demo student</strong></p>
        <button type="button" data-logout>Log out</button>
      </header>
      <main>
        <h1>My results</h1>
        <p class="demo-note">Demo - fictional data. Results are read-only. Missing marks appear as “Not entered”.</p>
        <section class="panel" aria-labelledby="results-title">
          <h2 id="results-title">Exam results</h2>
          <div class="filters">
            <label for="results-batch">Batch
              <select id="results-batch"></select>
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Exam</th><th>Batch</th><th>Date</th><th>Marks</th><th>Percentage</th></tr></thead>
              <tbody id="results-table"></tbody>
            </table>
          </div>
        </section>
        <p class="message" id="logout-message" role="status"></p>
      </main>
    </div>
  </div>
</body>
</html>
