<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Courses and Schedule</title>
  <link rel="stylesheet" href="assets/css/student.css">
  <script src="assets/js/student-data.js" defer></script>
  <script src="assets/js/student.js" defer></script>
</head>
<body data-page="courses">
  <div class="layout">
    <aside class="sidebar">
      <p class="brand">EduTrack</p>
      <nav aria-label="Student pages">
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="courses.html" aria-current="page">My courses</a>
        <a href="attendance.html">My attendance</a>
        <a href="results.html">My results</a>
      </nav>
    </aside>
    <div class="content">
      <header class="topbar">
        <p>Student: <strong data-student-name>Demo student</strong></p>
        <button type="button" data-logout>Log out</button>
      </header>
      <main>
        <h1>My courses and schedule</h1>
        <p class="demo-note">Demo - fictional data. Course details are read-only.</p>
        <section class="panel" aria-labelledby="courses-title">
          <h2 id="courses-title">Enrolled batches</h2>
          <div class="filters">
            <label for="course-filter">Enrollment status
              <select id="course-filter">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="ended">Ended</option>
              </select>
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Course</th><th>Batch</th><th>Teacher</th><th>Weekly schedule</th><th>Agreed monthly fee</th><th>Enrollment dates</th></tr></thead>
              <tbody id="courses-table"></tbody>
            </table>
          </div>
        </section>
        <p class="message" id="logout-message" role="status"></p>
      </main>
    </div>
  </div>
</body>
</html>
